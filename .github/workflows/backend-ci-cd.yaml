name: Backend CI and CD Pipeline

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
    IMAGE_NAME: nexus-backend-app

jobs:
    build-test:
        name: Build & Test
        runs-on: ubuntu-latest
        steps:
            # clone the project in the runner at /home/runner/work/
            - name: Checkout repository
              uses: actions/checkout@v4
        
            # install java in the runner 
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '17'
                cache: 'maven'
            
            # build and test
            - name: Build with Maven
              run: mvn clean verify

            # upload test results
            - name: upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: test-results
                path: target/surefire-reports/

    docker: 
        name: Build & Push Docker Image
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: build-test 
        steps:
            # clone the project in the runner at /home/runner/work/
            - name: Checkout repository
              uses: actions/checkout@v4
            
            # install docker buildx in runner
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            
            # login to docker hub with user name and password from the git secrets
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            # generate docker image name with tags <username>/<appname>:latest and  <username>/<appname>:<SHA>
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
                tags: |
                  type=latest
                  type=sha
            
            # push to docker hub
            - name: Build & push Docker image
              uses: docker/build-push-action@v5
              with: 
                context: . # current directory /home/runner/work/<repo>/<repo>/
                push: true # push to docker hub
                tags: ${{ steps.meta.outputs.tags }} # use docker image 
                cache-from: type=gha
                cache-to: type=gha,mode=max
            
    deploy:
        name: Deploy to AWS EC2
        runs-on: ubuntu-latest
        needs: docker
        if: github.event_name == 'push'
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_HOST }} # EC2 public ip
                username: ${{ secrets.EC2_USER }} # EC2 username
                key: ${{ secrets.EC2_SSH_KEY }}  # EC2 SSH secret key(.pem) 
                script: |

                    # pull docker image from docker hub
                    docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest || exit 1
                    
                    # stop existing container if running
                    docker stop backend || true

                    # remove old container
                    docker rm backend || true

                    docker logs backend || true

                    # run new container  with the latest image  at background, map EC2 port with container port and name it backend
                    docker run -d -p 8080:8080 --name backend \
                     --restart unless-stopped \
                     ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
                    
                    # add logs
                    docker logs backend || true